name: Projekte aktualisieren

# Holt alle öffentlichen Repos mit dem Topic "website" und schreibt projects.json.
# Läuft täglich, bei Änderungen an overrides.json/Skript und von Hand (Actions → Run workflow).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [overrides.json, scripts/build-projects.mjs, .github/workflows/projects.yml]

permissions:
  contents: write
  pages: write

concurrency:
  group: projects
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: projects.json erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-projects.mjs
      - name: Änderungen committen
        run: |
          if git diff --quiet -- projects.json && git ls-files --error-unmatch projects.json >/dev/null 2>&1; then
            echo "Keine Änderungen"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Projekte aktualisiert"
          git push
          # Pushes mit dem GITHUB_TOKEN lösen keinen Pages-Build aus → ausdrücklich anstoßen
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
